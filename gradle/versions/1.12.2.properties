# Version-specific properties for Minecraft 1.12.2 (selected via -Pmc_version=1.12.2)
minecraft_version=1.12.2
# MinecraftForge on RetroFuturaGradle: settings.gradle includes only :core-java8 and :forge1122 when this key is set.
legacy_forge=true
forge_version=14.23.5.2860
mcp_mapping_channel=stable
mcp_mapping_version=39
# The 1.12.2 jar runs on Java 8: core and protocol come in as the JvmDowngrader jar of :core-java8.
java_version=8
port_variant=1122
port_dirs=1122
pack_format=3
