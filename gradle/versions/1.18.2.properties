# Version-specific properties for Minecraft 1.18.2 (selected via -Pmc_version=1.18.2)
minecraft_version=1.18.2
minecraft_version_range=[1.18.2,1.18.3)
minecraft_version_range_alt=1.18.2
# Forge, not NeoForge: settings.gradle includes :forge instead of :neoforge when this key is set.
# Compiled against 40.2.0, the recommended build players still run: an API of a later 40.x patch is a compile error here.
forge_version=40.2.0
forge_version_range=[40.2,)
forge_loader_version_range=[40,)
fabric_version=0.77.0+1.18.2
fabric_loader_version=0.16.14
# Obfuscated Minecraft: Fabric remaps with Mojang names through the remapping Architectury Loom.
fabric_obfuscated=true
# The 1.18.2 jars run on Java 17, as do core and protocol.
java_version=17
# Port variant: one per loader API generation, shared by MC versions (docs/MULTIVERSION.md).
# Picks common/src/port<variant>/java and is written into META-INF/minuit/build.properties.
port_variant=1182
# Source folder suffixes under common/src/port<dir>, generation first; the last one is port_variant.
# 11x: GuiComponent statics over a PoseStack, before GuiGraphics.
port_dirs=11x,1182
# Resource pack format of 1.18.2 (8); the min, max and supported keys came after and 1.18.2 ignores them.
pack_format=8
pack_min_format=8
pack_max_format=8
