# Version-specific properties for Minecraft 1.20.1 (selected via -Pmc_version=1.20.1)
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
minecraft_version_range_alt=1.20.1
# Forge, not NeoForge, on 1.20.1: settings.gradle includes :forge instead of :neoforge when this key is set.
# Compiled against 47.1.0, the floor players still run: an API of a later 47.x patch is a compile error here.
forge_version=47.1.0
forge_version_range=[47.1,)
forge_loader_version_range=[47,)
fabric_version=0.92.12+1.20.1
fabric_loader_version=0.16.14
# Obfuscated Minecraft: Fabric remaps with Mojang names through the remapping Architectury Loom.
fabric_obfuscated=true
# The 1.20.1 jars run on Java 17, as do core and protocol.
java_version=17
# Port variant: one per loader API generation, shared by MC versions (docs/MULTIVERSION.md).
# Picks common/src/port<variant>/java and is written into META-INF/minuit/build.properties.
port_variant=1201
# Source folder suffixes under common/src/port<dir>, generation first; the last one is port_variant.
port_dirs=12x,1201
# Resource pack format of 1.20.1 (15); the min, max and supported keys came after and 1.20.1 ignores them.
pack_format=15
pack_min_format=15
pack_max_format=15
# No Paper library here: the Paper side is built for 26.x only (settings.gradle includes :paper when this key is set).
# Recipe viewers, compile only (optional: found by the viewer itself, never required at runtime).
1.20.1.properties
jei_api=mezz.jei:jei-1.20.1-common-api:15.71.0.224
rei_fabric=me.shedaniel:RoughlyEnoughItems-fabric:12.1.740
rei_forge=me.shedaniel:RoughlyEnoughItems-forge:12.1.740
