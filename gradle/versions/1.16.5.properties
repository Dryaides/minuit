# Version-specific properties for Minecraft 1.16.5 (selected via -Pmc_version=1.16.5)
minecraft_version=1.16.5
minecraft_version_range=[1.16.5,1.17)
minecraft_version_range_alt=1.16.5
# Forge, not NeoForge: settings.gradle includes :forge instead of :neoforge when this key is set.
# Compiled against 36.2.39, the floor of the range below.
# ModDevGradle cannot set up Forge before 1.17 (no Mojang-named MCP config): Architectury Loom builds :forge (forge/build-loom.gradle).
forge_loom=true
forge_version=36.2.39
forge_version_range=[36.2.39,)
forge_loader_version_range=[36,)
fabric_version=0.42.0+1.16
fabric_loader_version=0.16.14
# Obfuscated Minecraft: Fabric remaps with Mojang names through the remapping Architectury Loom.
fabric_obfuscated=true
# The 1.16.5 jars run on Java 8: core and protocol come in as the JvmDowngrader jar of :core-java8.
java_version=8
port_variant=1165
# 1165 alone: before the 1.17 render rewrite (fixed-function GL, no shaders), no generation dir to share.
port_dirs=1165
pack_format=6
pack_min_format=6
pack_max_format=6
# common/src/main classes that cannot compile on 1.16.5 (ItemStack.is(tag) came in 1.18): port1165 holds their copy.
main_overrides=dev/dryaides/minuit/internal/game/GameItems.java
# Fabric API 0.42.0+1.16 declares the mod id "fabric"; "fabric-api" came later.
fabric_api_id=fabric
