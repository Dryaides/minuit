# Version-specific properties for Minecraft 26.3 (selected via -Pmc_version=26.3)
minecraft_version=26.3
minecraft_version_range=[26.3, 26.4)
minecraft_version_range_alt=~26.3
neoform_version=26.3-1
neoforge_version=26.3.0.95
neoforge_version_range=[26.3,26.4)
fabric_version=0.161.0+26.3
fabric_loader_version=0.19.5
# Port variant: one per loader API generation, shared by MC versions (docs/MULTIVERSION.md).
# Picks common/src/port<variant>/java and is written into META-INF/minuit/build.properties.
port_variant=26_3
# Source folder suffixes under common/src/port<dir>, generation first; the last one is port_variant.
port_dirs=26x,26_3
main_overrides=dev/dryaides/minuit/client/GamepadPoll.java
# Highest resource/data pack format the jar declares in pack.mcmeta (26.3: resources 97, data 121).
pack_max_format=121
# Paper API the minuit-paper library compiles against (repo.papermc.io).
paper_api_version=26.3.build.223-stable
# Recipe viewers, compile only (optional: found by the viewer itself, never required at runtime).
26.3.properties
jei_api=mezz.jei:jei-26.3-common-api:31.16.0.89
rei_fabric=me.shedaniel:RoughlyEnoughItems-fabric:26.3.823
rei_neoforge=me.shedaniel:RoughlyEnoughItems-neoforge:26.3.823
