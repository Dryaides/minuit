# Version-specific properties for Minecraft 1.19.2 (selected via -Pmc_version=1.19.2)
minecraft_version=1.19.2
minecraft_version_range=[1.19.2,1.19.3)
minecraft_version_range_alt=1.19.2
# Forge, not NeoForge: settings.gradle includes :forge instead of :neoforge when this key is set.
# Compiled against 43.2.0, the recommended build players still run: an API of a later 43.x patch is a compile error here.
forge_version=43.2.0
forge_version_range=[43.2,)
forge_loader_version_range=[43,)
fabric_version=0.77.0+1.19.2
fabric_loader_version=0.16.14
# Obfuscated Minecraft: Fabric remaps with Mojang names through the remapping Architectury Loom.
fabric_obfuscated=true
# The 1.19.2 jars run on Java 17, as do core and protocol.
java_version=17
# Port variant: one per loader API generation, shared by MC versions (docs/MULTIVERSION.md).
# Picks common/src/port<variant>/java and is written into META-INF/minuit/build.properties.
port_variant=1192
# Source folder suffixes under common/src/port<dir>, generation first; the last one is port_variant.
# 11x: GuiComponent statics over a PoseStack, before GuiGraphics.
port_dirs=11x,1192
# Resource pack format of 1.19.2 (9); the min, max and supported keys came after and 1.19.2 ignores them.
pack_format=9
pack_min_format=9
pack_max_format=9
