# Version-specific properties for Minecraft 26.2 (selected via -Pmc_version=26.2)
minecraft_version=26.2
minecraft_version_range=[26.2, 26.3)
minecraft_version_range_alt=~26.2
neoform_version=26.2-1
neoforge_version=26.2.0.15-beta
neoforge_version_range=[26.2,26.3)
fabric_version=0.154.2+26.2
# Port variant: one per loader API generation, shared by MC versions (docs/MULTIVERSION.md).
# Picks common/src/port<variant>/java and is written into META-INF/minuit/build.properties.
port_variant=26_2
# Source folder suffixes under common/src/port<dir>, generation first; the last one is port_variant.
port_dirs=26x,26_2
# Highest resource/data pack format the jar declares in pack.mcmeta.
pack_max_format=94
fabric_loader_version=0.19.3
# Paper API the minuit-paper library compiles against (repo.papermc.io).
paper_api_version=26.2.build.135-stable
# Recipe viewers, compile only (optional: found by the viewer itself, never required at runtime).
26.2.properties
jei_api=mezz.jei:jei-26.2-common-api:30.30.0.203
rei_fabric=me.shedaniel:RoughlyEnoughItems-fabric:26.2.820
rei_neoforge=me.shedaniel:RoughlyEnoughItems-neoforge:26.2.820
