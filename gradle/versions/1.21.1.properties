# Version-specific properties for Minecraft 1.21.1 (selected via -Pmc_version=1.21.1)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
minecraft_version_range_alt=1.21.1
neoform_version=1.21.1-20240808.144430
neoforge_version=21.1.219
neoforge_version_range=[21.1.219,21.2)
fabric_version=0.116.17+1.21.1
fabric_loader_version=0.16.14
# Obfuscated Minecraft: Fabric remaps with Mojang names through the remapping Architectury Loom.
fabric_obfuscated=true
# The 1.21.x jars run on Java 21; core and protocol stay at release 17.
java_version=21
# Port variant: one per loader API generation, shared by MC versions (docs/MULTIVERSION.md).
# Picks common/src/port<variant>/java and is written into META-INF/minuit/build.properties.
port_variant=1211
# Source folder suffixes under common/src/port<dir>, generation first; the last one is port_variant.
port_dirs=12x,1211
# Resource and data pack format of 1.21.1 (resources 34, data 48); min_format and max_format are 1.21.9+ keys it ignores.
pack_format=34
pack_min_format=34
pack_max_format=48
# No Paper library here: the Paper side is built for 26.x only (settings.gradle includes :paper when this key is set).
# Recipe viewers, compile only (optional: found by the viewer itself, never required at runtime).
1.21.1.properties
jei_api=mezz.jei:jei-1.21.1-common-api:19.52.0.421
rei_fabric=me.shedaniel:RoughlyEnoughItems-fabric:16.0.729
rei_neoforge=me.shedaniel:RoughlyEnoughItems-neoforge:16.0.729
