# Project
version=1.1.0
group=dev.dryaides.minuit
java_version=25

# Target Minecraft version (see gradle/versions/<mc_version>.properties).
# 26.1.2 is the priority target, then 26.2 and 26.3. Override with -Pmc_version=26.2 or 26.3
mc_version=26.1.2

# Mod metadata. A library mod installed on its own; mods that draw with it declare a 1.x range.
mod_name=minuit
mod_author=Dryaides
mod_id=minuit
license=MIT
issues_url=https://github.com/Dryaides/minuit/issues
sources_url=https://github.com/Dryaides/minuit
description=Themed UI kit for Minecraft mod screens: widgets, palettes and frames, with one theme choice shared by every mod that uses it.

# Fabric (the loader version is per-MC-version, in gradle/versions/<mc>.properties)

# NeoForge (the NeoForge version itself is per-MC-version, in gradle/versions/<mc>.properties)
neoforge_loader_version_range=[1,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
