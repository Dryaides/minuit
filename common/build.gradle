// Loader-agnostic module: the Minecraft side of the kit (draw adapter, screen host, player choice).
// Compiled against plain vanilla via NeoForm; the loader modules recompile these sources.

plugins {
    id 'multiloader-common'
}

// Compile common against plain vanilla with official names: NeoForm, or on 1.20.1 (no NeoForm there)
// ModDevGradle's legacy mode with Forge's MCP config of that version.
def legacy = project.hasProperty('forge_version')
// 1.16.5 (Java 8): neither NeoForm nor ModDevGradle sets up a Minecraft before 1.17, so :common only hands its
// sources to the loaders, which compile them against their own Minecraft and the Java 8 core jar.
def java8 = java_version == '8'
if (java8) {
    tasks.named('compileJava') { enabled = false }
} else if (legacy) {
    apply plugin: 'net.neoforged.moddev.legacyforge'
    legacyForge {
        mcpVersion = minecraft_version
    }
} else {
    apply plugin: 'net.neoforged.moddev'
    neoForge {
        neoFormVersion = neoform_version
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

// The port dirs of this Minecraft version (gradle/versions/<mc>.properties), generation first:
// their sources are the only ones besides src/main that may differ between versions.
def portDirs = port_dirs.split(',')*.trim()
if (portDirs.last() != port_variant) {
    throw new GradleException("port_dirs ${port_dirs} must end with port_variant ${port_variant}")
}
portDirs.each { dir ->
    sourceSets.main.java.srcDir "src/port${dir}/java"
    sourceSets.main.resources.srcDir "src/port${dir}/resources"
}

// A version dir's copy of a src/main class (main_overrides) stands in for it; the loaders filter the same way.
def mainOverrides = (project.findProperty('main_overrides') ?: '').toString().split(',')*.trim().findAll()
if (mainOverrides) {
    def mainDir = file('src/main/java')
    sourceSets.main.java.exclude { element ->
        mainOverrides.contains(element.relativePath.pathString) && element.file.path.startsWith(mainDir.path)
    }
}

artifacts {
    sourceSets.main.java.sourceDirectories.each { commonJava it }
    sourceSets.main.resources.sourceDirectories.each { commonResources it }
}

repositories {
    // The mixin annotations, for mixin/ only; each loader ships its own mixin at runtime.
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
        content { includeGroup 'net.fabricmc' }
    }
}

dependencies {
    // The pure half. api, so the mods that compile against :common see it too.
    if (!java8) {
        api(project(':core')) {
            capabilities {
                requireCapability "$group:$mod_id-core"
            }
        }
    }
    compileOnly('net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7')
}

// Rules in tools/fence.py.
tasks.register('fence', Exec) {
    group = 'verification'
    workingDir = rootDir
    commandLine 'python', 'tools/fence.py', rootDir.path
    inputs.dir('src')
    inputs.file('fence.tsv')
    outputs.upToDateWhen { false }
}
tasks.named('check') { dependsOn 'fence' }

// The dialog codec check runs only when asked (`:common:test`), never as part of an ordinary build.
// Its tests read the 26x dialogs, so a generation without dialogs compiles none of them.
if (!portDirs.contains('26x')) {
    sourceSets.test.java.srcDirs = []
}
if (!legacy) {
    neoForge {
        addModdingDependenciesTo sourceSets.test
    }
}
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test', Test) {
    enabled = gradle.startParameter.taskNames.any { it.toLowerCase().contains('test') }
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
}
