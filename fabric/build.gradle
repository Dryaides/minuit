// Fabric build. 26.x ships unobfuscated, so it uses the Architectury Loom "-no-remap" variant: NO
// mappings config, plain `implementation` instead of `modImplementation`. An obfuscated version
// (fabric_obfuscated=true in gradle/versions/<mc>.properties, 1.21.1) takes the remapping variant of
// the same Loom jar, with Mojang names and a mixin refmap.
// Output is the one minuit mod jar for Fabric; the mods that use it declare it in `depends`.

plugins {
    id 'multiloader-loader'
}

def obfuscated = (project.findProperty('fabric_obfuscated') ?: 'false').toBoolean()
apply plugin: obfuscated ? 'dev.architectury.loom-remap' : 'dev.architectury.loom-no-remap'

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    if (obfuscated) {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    } else {
        implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    }
    // REI's Fabric jar carries its API; intermediary names on obfuscated versions, hence mod*.
    if (project.findProperty('rei_fabric')) {
        "${obfuscated ? 'modCompileOnly' : 'compileOnly'}"(project.rei_fabric.toString()) { transitive = false }
        // REI's Rectangle (exclusion zones) lives in cloth basic-math, the version cloth-config pulls in for REI; never bundled.
        "${obfuscated ? 'modCompileOnly' : 'compileOnly'}"('me.shedaniel.cloth:basic-math:0.6.1') { transitive = false }
    }
}

// The viewer entrypoints, only on the versions whose jar holds the plugin classes (fabric.mod.json is shared).
def viewerEntrypoints = ''
if (project.findProperty('jei_api')) {
    viewerEntrypoints += ',\n    "jei_mod_plugin": ["dev.dryaides.minuit.client.MinuitJeiPlugin"]'
}
if (project.findProperty('rei_fabric')) {
    viewerEntrypoints += ',\n    "rei_client": ["dev.dryaides.minuit.client.MinuitReiPlugin"]'
}

if (obfuscated) {
    // The refmap the 12x minuit.mixins.json names; NeoForge runs Mojang names and needs none.
    loom {
        mixin {
            useLegacyMixinAp = true
            defaultRefmapName = 'minuit.refmap.json'
        }
    }
    // The published jar is the remapped one, as the game loads it.
    publishing.publications.named('mod', MavenPublication) {
        artifacts = [tasks.named('remapJar'), tasks.named('remapSourcesJar')]
    }
}

// Mod Menu's two API interfaces as compile stand-ins, so MinuitModMenu builds with no Mod Menu
// dependency. No jar carries them: with Mod Menu installed the game links its real ones.
sourceSets.main.java.srcDir 'src/modmenu-api/java'
tasks.withType(Jar).configureEach {
    exclude 'com/terraformersmc/**'
}

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

processResources {
    def props = [
            "version"                : project.version,
            "mod_id"                 : project.mod_id,
            "mod_name"               : project.mod_name,
            "mod_description"        : project.description,
            "mod_authors"            : project.mod_author,
            "mod_license"            : project.license,
            "minecraft_version_range": project.minecraft_version_range_alt.toString(),
            "java_version"           : project.java_version.toString(),
            "fabric_loader_version"  : project.fabric_loader_version.toString(),
            "sources_url"            : project.sources_url,
            "issues_url"             : project.issues_url,
            // Fabric API's mod id was "fabric" until the 1.19 era; 1.16.5 sets fabric_api_id=fabric.
            "fabric_api_id"          : (project.findProperty('fabric_api_id') ?: 'fabric-api').toString(),
            "viewer_entrypoints"     : viewerEntrypoints,
    ]
    // Mod Menu's API package on 1.16.5 is not checked yet: no Config button there for now.
    def modMenu = project.minecraft_version.toString() != '1.16.5'
    inputs.property("mod_menu", modMenu)
    if (!modMenu) {
        filesMatching("fabric.mod.json") {
            filter { line -> line.contains('"modmenu": ["') ? null : line }
        }
    }
    inputs.properties(props)
    filesMatching("fabric.mod.json") { expand props }
}

// With -PminuitDev the dev entrypoints join fabric.mod.json (dev runs only, see multiloader-loader).
if (providers.gradleProperty('minuitDev').isPresent()) {
    processResources {
        filesMatching("fabric.mod.json") {
            filter { line ->
                line.replace('"main": ["dev.dryaides.minuit.fabric.MinuitFabric"]',
                        '"main": ["dev.dryaides.minuit.fabric.MinuitFabric", "dev.dryaides.minuit.dev.FabricDev"]')
                    .replace('"client": ["dev.dryaides.minuit.fabric.MinuitFabricClient"]',
                        '"client": ["dev.dryaides.minuit.fabric.MinuitFabricClient", "dev.dryaides.minuit.dev.FabricDevClient"]')
            }
        }
    }
}
