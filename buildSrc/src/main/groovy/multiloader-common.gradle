// Shared conventions for the :common, :fabric and :neoforge subprojects.
// Mirrors the ml26 multiloader-common convention.

plugins {
    id 'java-library'
    id 'maven-publish'
}

// Multi-version selector: -Pmc_version=26.2|... (default from root gradle.properties) picks a
// gradle/versions/<mc_version>.properties file holding the version-specific keys.
def mcv = (project.findProperty('mc_version') ?: '26.1.2').toString()
def versionFile = rootProject.file("gradle/versions/${mcv}.properties")
if (!versionFile.exists()) {
    throw new GradleException("Unknown mc_version '${mcv}': ${versionFile} not found. Available: " +
            rootProject.file('gradle/versions').listFiles()*.name.join(', '))
}
def versionProps = new Properties()
versionFile.withInputStream { versionProps.load(it) }
versionProps.each { k, v -> project.ext.setProperty(k.toString(), v.toString()) }

project.ext.brick_id = mod_id.toString()

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    implementation 'org.jetbrains:annotations:24.1.0'
}

['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$brick_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    def expandProps = [
            "version"                    : version,
            "group"                      : project.group,
            "minecraft_version"          : minecraft_version,
            "minecraft_version_range"    : minecraft_version_range,
            "minecraft_version_range_alt": minecraft_version_range_alt,
            "pack_max_format"            : pack_max_format,
            // 26.x keeps the formats it had before the key existed; 1.21.1 sets its own.
            "pack_format"                : project.findProperty('pack_format') ?: '75',
            "pack_min_format"            : project.findProperty('pack_min_format') ?: '64',
            "mod_name"                   : mod_name,
            "mod_author"                 : mod_author,
            "mod_id"                     : mod_id,
            "license"                    : license,
            "issues_url"                 : issues_url,
            "sources_url"                : sources_url,
            "description"                : project.description,
            "java_version"               : java_version
    ]

    filesMatching(['pack.mcmeta']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}
